name: Windows PTY

on:
  workflow_dispatch:
  # TEMPORARY: remove before merging (workflow_dispatch needs the file on main)
  push:
    branches: [feat/windows-native-pty]
    paths:
      - 'pty/**'
      - 'term/**'
      - 'tui/vendor/**'
      - 'cli/src/lib/ptyHost/**'
      - 'cli/src/lib/ptyHostBackend*.ts'
      - 'cli/src/lib/windows/**'
      - '.github/workflows/windows-pty.yml'

concurrency:
  group: windows-pty-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-pty:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: harness-pty-windows-x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: harness-pty-windows-arm64
    # Each runner builds and tests its own native target. Cross-building the other
    # target is dropped: it needs extra MSVC components and adds little signal.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          # Same runtime pin as release.yml / ci.yml.
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: cli/package-lock.json
      # Task 20 adds this script; skipped until it exists.
      - name: Fetch ConPTY payload
        if: hashFiles('pty/scripts/fetch-conpty.ps1') != ''
        shell: pwsh
        run: pwsh pty/scripts/fetch-conpty.ps1
      - name: Rust tests
        working-directory: pty
        run: cargo test --target ${{ matrix.target }}
      - name: Build release
        working-directory: pty
        run: cargo build --release --target ${{ matrix.target }}
      - name: CLI install
        working-directory: cli
        run: npm ci
      # continue-on-error: ptyhost `serve` is "unsupported" on Windows until the named
      # pipe lands (Task 17), so this is expected to fail until then. It becomes
      # required (remove continue-on-error) after Task 17.
      - name: Contract suite against the real host
        continue-on-error: true
        working-directory: cli
        shell: pwsh
        env:
          RUN_TERMINAL_CONTRACT: "1"
          HARNESS_PTY_BIN: ${{ github.workspace }}\pty\target\${{ matrix.target }}\release\harness-pty.exe
        run: |
          $paths = @('src/lib/ptyHostBackend.contract.spec.ts', 'src/lib/ptyHost')
          if (Test-Path 'src/lib/windows') { $paths += 'src/lib/windows' }
          npx vitest run @paths --maxWorkers=1 --passWithNoTests
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: pty/target/${{ matrix.target }}/release/harness-pty.exe
